# Cloudflare Workers — static Astro build in dist/ + thin edge worker (www → apex).
# Docs: https://developers.cloudflare.com/workers/static-assets/
name = "cheatsdayz-com"
main = "worker/index.ts"
compatibility_date = "2025-10-11"
workers_dev = true

# Connected Git / Workers Builds (reads .node-version for Node 22).
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Run worker before assets so www canonical redirect always applies.
run_worker_first = true

# After `wrangler login`, attach your domain (zone must be on this Cloudflare account):
# [[routes]]
# pattern = "cheatsdayz.com/*"
# zone_name = "cheatsdayz.com"
#
# [[routes]]
# pattern = "www.cheatsdayz.com/*"
# zone_name = "cheatsdayz.com"
