# Cloudflare Workers — static Astro build in dist/ + thin edge worker (www → apex).
# Docs: https://developers.cloudflare.com/workers/static-assets/
name = "cheatsdayz-com"
main = "worker/index.ts"
compatibility_date = "2025-10-11"
workers_dev = true

# CI / GitHub Actions run `npm run build` first; wrangler only uploads dist/ + worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Run worker before assets so www canonical redirect always applies.
run_worker_first = true

# Custom domain (do AFTER zone cheats-dayz.com is on this Cloudflare account):
# Recommended: Workers & Pages → cheatsdayz-com → Domains & Routes → add apex + www.
# See docs/CLOUDFLARE-HANDOFF-ROMAN-URDU.md — leave routes commented until zone exists.
#
# Alternative (advanced): uncomment both blocks, then `npm run deploy`.
# [[routes]]
# pattern = "cheats-dayz.com/*"
# zone_name = "cheats-dayz.com"
#
# [[routes]]
# pattern = "www.cheats-dayz.com/*"
# zone_name = "cheats-dayz.com"
