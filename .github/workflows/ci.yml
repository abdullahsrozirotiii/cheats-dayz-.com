# Build + SEO checks only — no Cloudflare tokens, no deploy.
# Production deploy: Cloudflare dashboard (Workers Builds) or `npm run deploy` locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deploy config
        run: npm run verify:deploy

      - name: Build site
        run: npm run build
